[workspace]
resolver = "2"
members = ["crates/*", "conformance/schema-check"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/SCcagg5/procurauth"
publish = false

[workspace.dependencies]
base64 = "0.22"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8", "pem"] }
hex = "0.4"
jsonschema = { version = "0.30", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["std", "ecdsa", "pkcs8", "pem"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
