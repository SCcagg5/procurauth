name: release

# A tag such as v1.0 builds the programs for each platform and makes a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  PROGRAMS: "-p keycheck -p access-token -p access-lint -p fake-pdp -p access-conformance -p reference-service -p reference-edge"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04,     target: x86_64-unknown-linux-musl,  name: x86_64-linux,   exe: "",     pack: tar }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, name: aarch64-linux,  exe: "",     pack: tar }
          - { runner: macos-14,         target: aarch64-apple-darwin,       name: aarch64-macos,  exe: "",     pack: tar }
          - { runner: macos-14,         target: x86_64-apple-darwin,        name: x86_64-macos,   exe: "",     pack: tar }
          - { runner: windows-2022,     target: x86_64-pc-windows-msvc,     name: x86_64-windows, exe: ".exe", pack: zip }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Add the target
        shell: bash
        run: rustup target add "${{ matrix.target }}"
      - name: Build
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}" $PROGRAMS
      - name: Pack
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="procurauth-tools-${version}-${{ matrix.name }}"
          mkdir "$dir"
          for program in keycheck access-token access-lint fake-pdp access-conformance reference-service reference-edge; do
            cp "target/${{ matrix.target }}/release/${program}${{ matrix.exe }}" "$dir/"
          done
          cp LICENSE LICENSE-TEXTS.txt "$dir/"
          if [ "${{ matrix.pack }}" = tar ]; then
            tar -czf "${dir}.tar.gz" "$dir"
            file="${dir}.tar.gz"
          else
            7z a -tzip "${dir}.zip" "$dir" > /dev/null
            file="${dir}.zip"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$file" > "${file}.sha256"; else shasum -a 256 "$file" > "${file}.sha256"; fi
          echo "FILE=$file" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.FILE }}
            ${{ env.FILE }}.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Make the sums and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "ProcurAuth ${GITHUB_REF_NAME#v}" \
            --notes "Programs of ProcurAuth ${GITHUB_REF_NAME#v}. Check each archive with SHA256SUMS." \
            ./*.tar.gz ./*.zip ./*.sha256 SHA256SUMS
