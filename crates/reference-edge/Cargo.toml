[package]
name = "reference-edge"
description = "A small reference edge for ProcurAuth: an HTTP reverse proxy that checks a key, asks the PDP for access, and gives the service an identity token. It is the test subject of the series E of the conformance cases."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "reference_edge"
path = "src/lib.rs"

[[bin]]
name = "reference-edge"
path = "src/main.rs"

[dependencies]
access-token = { path = "../access-token" }
procurauth-core = { path = "../procurauth-core" }
procurauth-pep = { path = "../procurauth-pep", default-features = false }
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ctrlc = { version = "3.4", features = ["termination"] }

[dev-dependencies]
base64.workspace = true
fake-pdp = { path = "../fake-pdp" }
procurauth-schema-check = { path = "../../conformance/schema-check" }
