[package]
name = "fake-pdp"
description = "A test decision point for ProcurAuth: AuthZEN 1.0 endpoints, fixed data, counters in memory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "fake_pdp"
path = "src/lib.rs"

[[bin]]
name = "fake-pdp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
procurauth-core = { path = "../procurauth-core" }
serde_json.workspace = true
sha2.workspace = true
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ctrlc = { version = "3.4", features = ["termination"] }

[dev-dependencies]
procurauth-schema-check = { path = "../../conformance/schema-check" }
regex.workspace = true
