[package]
name = "reference-service"
description = "A small reference service for ProcurAuth. It uses procurauth-pep, and it is the test subject of the series U of the conformance cases."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "reference_service"
path = "src/lib.rs"

[[bin]]
name = "reference-service"
path = "src/main.rs"

[features]
default = ["mcp"]
# The MCP endpoint, with the helpers of procurauth-pep.
mcp = ["procurauth-pep/mcp"]

[dependencies]
procurauth-core = { path = "../procurauth-core" }
procurauth-pep = { path = "../procurauth-pep", default-features = false }
serde_json.workspace = true
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
ctrlc = { version = "3.4", features = ["termination"] }

[dev-dependencies]
base64.workspace = true
access-token = { path = "../access-token" }
fake-pdp = { path = "../fake-pdp" }
regex.workspace = true
procurauth-schema-check = { path = "../../conformance/schema-check" }
